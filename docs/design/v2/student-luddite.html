<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>학생 · 러다이트 (v2)</title>
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="student.css">
</head>
<body class="luddite">
<div class="screen">
  <div class="top">
    <div class="who"><span class="mark">[ 비인가 접속 ]</span><span>신호 우회 중</span><span class="badge">러다이트</span></div>
    <div class="clock"><span class="sys">17:42</span><span><span class="dot live" style="background:var(--side)"></span> 진행 중</span></div>
    <div class="net"><span>방 <span class="sys">AH7FHG</span></span><span>28명 접속</span><span><span class="dot on" style="background:var(--side)"></span> 연결됨</span></div>
  </div>
  <div class="game">
    <img src="game.png" alt="">
    <div class="chip room">습격 중 · <b>서연</b>의 기록실</div>
    <div class="chip event raid"><b>⚡ 실시간 공격</b><span class="sys">09</span><small>서연에게 다가가 SPACE · 감전 3/5 · 15점 탈취</small></div>
    <div class="chip toast">📡 1960년대 원본 확보 · 러다이트 +10</div>
    <div class="chip map" id="map"></div>
    <div class="chip prompt"><kbd>SPACE</kbd> 감전 — 서연이 바로 앞에 있어요</div>
  </div>
  <div class="hud">
    <div class="missions"><span class="sys">20</span><div><small>미션 · 다음 단말기 고장까지 5개</small><div class="pips"><i></i><i></i><i></i><i></i><i></i></div></div></div>
    <div class="actions">
      <button class="btn">💥 단말기 고장 <span class="n">1</span><kbd>1</kbd></button>
      <button class="btn" disabled>⚡ 공격 중 <span class="n">0</span><kbd>2</kbd><kbd>2</kbd></button>
      <button class="btn hold">🪤 함정<kbd>3</kbd></button>
    </div>
    <div class="keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span><span><kbd>E</kbd> 열기</span><span><kbd>SPACE</kbd> 감전</span><span><kbd>ESC</kbd> 닫기</span></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const own = (b, r) => ({ blue: 'b', red: 'r' })[D.owner(b, r)] ?? '';
const { blue, red } = D.totals();
map.innerHTML = `<span class="t"><span>점령 현황</span><span><span class="c-blue">${blue}</span> : <span class="c-red">${red}</span></span></span>` + D.ERAS.map(([y, b, r]) => `<i class="${own(b, r)} ${D.CONTAM.has(y) ? 'c' : ''} ${D.isClose(b, r) ? 'k' : ''}">${y.slice(2)}</i>`).join('');
</script>
</body>
</html>
