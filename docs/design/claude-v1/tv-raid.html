<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TV · 실시간 공격 중계</title>
<link rel="stylesheet" href="system.css">
<style>
body{width:1920px;height:1080px;overflow:hidden}
.screen{height:100%;padding:44px 72px 56px;display:grid;grid-template-rows:auto 1fr;row-gap:32px}
/* 평소 전황은 한 줄로 접힌다 */
.strip{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;column-gap:28px;font-size:24px}
.strip .sys{font-size:56px;line-height:1}
.strip .bar{height:8px;border-radius:4px;display:flex;overflow:hidden;background:var(--red)}.strip .bar i{width:56.7%;background:var(--blue)}
.strip .clock{font-size:56px}
.main{display:grid;grid-template-columns:1fr 520px;column-gap:48px;min-height:0}
.stage{position:relative;border-radius:var(--r);overflow:hidden;background:#000}
.stage img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;image-rendering:pixelated;filter:saturate(.9)}
.stage .live{position:absolute;left:24px;bottom:22px;font-family:var(--sys);font-size:24px;background:#000d;padding:8px 14px;border-radius:8px}
/* 지도 위 이름표: 공격자만 진영색 테두리 */
.tag{position:absolute;font-size:24px;font-weight:700;padding:6px 12px;border-radius:8px;background:#000c;transform:translate(-50%,-100%)}
.tag.att{box-shadow:inset 0 0 0 2px var(--red);color:var(--red)}
.tag.def{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue)}
.marker{position:absolute;width:36px;height:52px;transform:translate(-50%,-50%);border:3px dashed var(--red);border-radius:6px}
.side{display:flex;flex-direction:column;gap:36px}
.who{font-size:30px;line-height:1.5}
.who .eyebrow{font-family:var(--sys);color:var(--red);font-size:24px;letter-spacing:.1em}
.who b{font-size:44px;font-weight:800}
.who .arrow{color:var(--faint);margin:0 .3em}
.count .sys{font-size:200px;line-height:.85}
.count>span:last-child{display:block;font-size:24px;color:var(--muted);margin-top:12px}
.shocks{display:flex;gap:12px}
.shocks i{width:56px;height:16px;border-radius:4px;background:var(--surface)}
.shocks i.on{background:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats div{background:var(--surface);border-radius:var(--r);padding:20px 24px}
.stats span{display:block;font-size:24px;color:var(--muted)}
.stats .sys{font-size:48px}
.queue{font-size:24px;color:var(--muted)}
</style>
</head>
<body>
<div class="screen">
  <div class="strip">
    <span class="muted">남은 시간 <span class="sys clock" style="color:var(--text);margin-left:12px">17:42</span></span><span class="sys c-blue" style="margin-left:40px">340</span><span class="bar"><i></i></span><span class="sys c-red">260</span>
  </div>
  <section class="main">
    <div class="stage">
      <img src="game.png" alt="">
      <span class="live"><span class="dot live" style="background:var(--red)"></span> 실시간 공격 · 서연의 기록실</span>
      <span class="marker" style="left:59%;top:74%"></span>
      <span class="tag att" style="left:59%;top:69%">민준</span>
    </div>
    <div class="side">
      <div class="who"><div class="eyebrow">⚡ 침입 감지</div><b class="c-red">민준</b><span class="arrow">→</span><b class="c-blue">서연</b><br><span class="muted">러다이트가 보존관의 기록실에 들어왔어요</span></div>
      <div class="count"><span class="sys">09</span><span>남은 초</span></div>
      <div><div class="shocks"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div><p class="queue" style="margin-top:12px">감전 3 / 5</p></div>
      <div class="stats"><div><span>탈취한 점수</span><b class="sys c-red">15</b></div><div><span>서연 상태</span><b style="font-size:40px;font-weight:800">회피 중</b></div></div>
      <p class="queue">대기 중인 중계 1건 · 도윤 → 하은</p>
    </div>
  </section>
</div>
</body>
</html>
