<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TV · 입장 대기</title>
<link rel="stylesheet" href="system.css">
<style>
body{width:1920px;height:1080px;overflow:hidden}
.screen{height:100%;padding:44px 72px 64px;display:grid;grid-template-rows:auto 1fr auto;row-gap:24px}
.sysline{font-size:24px;justify-content:space-between}
.center{display:grid;grid-template-columns:440px 1fr;column-gap:80px;align-items:center}
.qr{width:440px;height:440px;background:#fff;border-radius:20px;padding:28px}
.eyebrow{font-size:28px;color:var(--muted)}
h1{font-size:56px;font-weight:800;margin:12px 0 40px;letter-spacing:-.01em}
.code{display:flex;flex-direction:column;gap:8px}
.code>span:first-child{font-size:26px;color:var(--muted)}
.code .sys{font-size:160px;line-height:1;letter-spacing:.14em}
.url{margin-top:28px;font-size:30px;color:var(--muted)}.url b{color:var(--text);font-weight:600}
.teams{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.team h2{display:flex;align-items:baseline;gap:16px;font-size:30px;margin-bottom:18px}
.team h2 .sys{font-size:44px}
.team.blue h2{color:var(--blue)}.team.red h2{color:var(--red)}
.names{display:flex;flex-wrap:wrap;gap:10px}
.names span{font-size:24px;padding:6px 14px;border-radius:99px;background:var(--surface)}
.names span.new{background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--text)}
</style>
</head>
<body>
<div class="screen">
  <div class="sysline"><span><b>HUMAN ARCHIVE NET</b> · SECTOR 03 · 기록원 소집</span><span><span class="dot live"></span> 대기 중 · 14:02:31</span></div>
  <section class="center">
    <div class="qr" id="qr"></div>
    <div>
      <div class="eyebrow">2030 현대문학사 데이터 점령전</div>
      <h1>기록원 접속을 기다리는 중</h1>
      <div class="code"><span>입장 코드</span><span class="sys">AH7FHG</span></div>
      <div class="url">QR을 찍거나 <b>lit-war-multiplayer.gugeo.workers.dev</b> → 교실 입장</div>
    </div>
  </section>
  <section class="teams">
    <div class="team blue"><h2><span class="sys">12</span>인류유산 보존관</h2><div class="names" id="blue"></div></div>
    <div class="team red"><h2><span class="sys">11</span>러다이트</h2><div class="names" id="red"></div></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<script src="data.js"></script>
<script>
D.renderQR(qr);
for (const team of ['blue', 'red']) document.getElementById(team).innerHTML = D.ROSTER.filter(p => p.team === team).slice(0, team === 'blue' ? 12 : 11).map((p, i) => `<span class="${i === (team === 'blue' ? 11 : 10) ? 'new' : ''}">${p.name}</span>`).join('');
</script>
</body>
</html>
